server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      #      CORS 처리. 서비스모듈에서는 웹브라우저와 직접 통신하지 않으므로, cors처리 불필요.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - 'http://localhost:3000'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: member-service
          predicates:
            - Path=/member/**
          filters:
            - StripPrefix=1
          uri: lb://member-service

        - id: member-service-company
          predicates:
            - Path=/company/**
          filters:
            - StripPrefix=1
          uri: lb://member-service

        - id: member-service-organization
          predicates:
            - Path=/organization/**
          filters:
            - StripPrefix=1
          uri: lb://member-service

        - id: attendance-service
          predicates:
            - Path=/attendance/**
          filters:
            - StripPrefix=1
          uri: lb://attendance-service

        - id: approval-service
          predicates:
            - Path=/approval/**
          filters:
            - StripPrefix=1
          uri: lb://approval-service

        - id: salary-service
          predicates:
            - Path=/salary/**
          filters:
            - StripPrefix=1
          uri: lb://salary-service

        - id: goal-service
          predicates:
            - Path=/goal/**
          filters:
            - StripPrefix=1
          uri: lb://goal-service

        - id: insight-service
          predicates:
            - Path=/insight/**
          filters:
            - StripPrefix=1
          uri: lb://insight-service

