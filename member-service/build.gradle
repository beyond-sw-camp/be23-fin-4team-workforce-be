plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':common')
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // WebClient (국세청 API, 카카오 API 호출용)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Redis (캐싱, 이메일 인증 코드 저장)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'redis.clients:jedis:5.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    //aop 의존성
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // Mail (임시 비밀번호 발송)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 비밀번호 암호화
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // QueryDSL (사원 검색 동적쿼리용)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// QueryDSL이 자동으로 만들어내는 코드(Q-클래스)를 IntelliJ 같은 IDE가 정상적으로 인식하게 하고, 빌드 충돌을 막기 위한 설정
def querydslGenerated = "$buildDir/generated/sources/annotationProcessor/java/main"
sourceSets {
    main {
        java {
            srcDirs += [querydslGenerated]
        }
    }
}
// ./gradlew clean 할 때 Q클래스 디렉토리도 같이 지움
tasks.named('clean') {
    doLast {
        file(querydslGenerated).deleteDir()
    }

    // --- member-chat (human chat) ---
    // WebSocket / STOMP (기존 챗봇은 REST 기반이라 충돌 없음)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // STOMP over SockJS / JSON 직렬화용
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // 멱등성/rate-limit/권한 테스트용
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}