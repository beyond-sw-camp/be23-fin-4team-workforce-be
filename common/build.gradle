plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.mariadb.jdbc:mariadb-java-client'
    api 'org.springframework.kafka:spring-kafka'
    api 'org.springframework.boot:spring-boot-starter'
    api 'org.projectlombok:lombok'
    api 'software.amazon.awssdk:s3:2.29.50'
    // ShedLock
    api 'net.javacrumbs.shedlock:shedlock-spring:5.1.0'
    api 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // QueryDSL (BaseTimeEntity 같은 @MappedSuperclass의 Q클래스도 생성되게)
    // member-service 등 QueryDSL 쓰는 모듈에서 QBaseTimeEntity 참조를 위해 필요
    api 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// QueryDSL이 자동으로 만들어내는 코드(Q-클래스)를 IntelliJ 같은 IDE가 정상적으로 인식하게 하고, 빌드 충돌을 막기 위한 설정
def querydslGenerated = "$buildDir/generated/sources/annotationProcessor/java/main"
sourceSets {
    main {
        java {
            srcDirs += [querydslGenerated]
        }
    }
}
tasks.named('clean') {
    doLast {
        file(querydslGenerated).deleteDir()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}